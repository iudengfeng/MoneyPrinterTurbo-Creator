name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MPT_TEST_REDIS_HOST: 127.0.0.1
      MPT_TEST_REDIS_PORT: 6379
      MPT_TEST_REDIS_DB: 15
      MPT_FFPROBE: /usr/bin/ffprobe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            creator-hyperframes/package-lock.json
            creator-browser/package-lock.json

      - name: Install media tools and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg fonts-noto-cjk
          test -x /usr/bin/ffmpeg
          test -x /usr/bin/ffprobe
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Select bundled FFmpeg
        # Keep media decoding on the binary supplied by the locked Python
        # dependency rather than the runner's independently updated package.
        run: |
          creator_ffmpeg="$(uv run --no-sync python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          test -x "$creator_ffmpeg"
          echo "IMAGEIO_FFMPEG_EXE=$creator_ffmpeg" >> "$GITHUB_ENV"
          "$creator_ffmpeg" -version

      - name: Install creator Node components
        run: |
          npm ci --prefix creator-hyperframes
          npm ci --prefix creator-browser

      - name: Check publishing browser policy
        if: matrix.python-version == '3.11'
        run: npm test --prefix creator-browser

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill

      - name: Lint Python sources
        if: matrix.python-version == '3.11'
        run: uv run --no-sync ruff check app cli.py main.py webui test docs/skill

      - name: Check audio validation environment
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_bgm_decoded_audio.py
          test/services/test_webui_bgm.py
          test/services/test_webui_custom_audio_upload.py

      - name: Run unit tests with coverage
        # pytest 兼容现有 unittest.TestCase，同时会收集仓库中的 pytest 风格
        # 测试，避免测试文件已存在但 CI 没有真正执行。
        run: uv run --no-sync python -X utf8 -m coverage run -m pytest -q test

      - name: Report test coverage
        run: uv run --no-sync python -m coverage report

      - name: Export coverage report
        run: uv run --no-sync python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  windows-smoke:
    name: Windows smoke tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill

      - name: Run core service smoke tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_config.py
          test/services/test_state.py
          test/services/test_task.py
          test/services/test_task_manager.py
          test/services/test_upload_post.py
          test/services/test_controller_video.py
          test/services/test_webui_task.py
          test/services/test_webui_headless_task_actions.py
